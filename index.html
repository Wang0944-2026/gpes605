<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>僑平國小 605 聯絡簿</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .homework-item { transition: all 0.3s ease; }
        .homework-item:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        .sync-indicator { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .saving-overlay, .date-picker-overlay, .password-dialog-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 10000;
        }
        .date-picker-dialog {
            background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center; max-width: 400px; width: 90%; max-height: 80vh; overflow-y: auto;
        }
        .date-picker-input {
            width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 16px;
            text-align: center; margin-bottom: 16px; outline: none; transition: border-color 0.2s;
        }
        .date-picker-input:focus { border-color: #6366f1; }
        .homework-confirmed { background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%); border: 2px solid #10b981; }
        .homework-editing { background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%); border: 2px solid #6b7280; }
        
        /* 拖拽排序樣式 */
        .sortable-item { cursor: move; transition: all 0.2s ease; }
        .sortable-item:hover { transform: translateY(-1px); }
        .sortable-item.dragging { opacity: 0.5; transform: rotate(2deg); z-index: 1000; }
        .sortable-item.drag-over { border-top: 3px solid #6366f1; }
        .drag-handle { cursor: grab; color: #9ca3af; transition: color 0.2s; }
        .drag-handle:hover { color: #6366f1; }
        .drag-handle:active { cursor: grabbing; }
        .sort-mode-indicator {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%); border: 2px solid #f59e0b; border-radius: 12px;
            padding: 8px 16px; margin-bottom: 16px; text-align: center; font-weight: 600; color: #92400e;
        }
        .global-sortable-item { cursor: move; transition: all 0.2s ease; }
        .global-sortable-item.dragging { opacity: 0.5; transform: rotate(2deg); z-index: 1000; }
        .global-sortable-item.drag-over { border-top: 3px solid #eab308; }
        .global-drag-handle { cursor: grab; color: #9ca3af; transition: color 0.2s; }
        .global-drag-handle:hover { color: #ca8a04; }
        .global-drag-handle:active { cursor: grabbing; }
        
        /* 跑馬燈動畫 */
        @keyframes scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .marquee-wrapper { overflow: hidden; display: flex; align-items: center; width: 100%; }
        .marquee-content {
            display: flex; white-space: nowrap; width: max-content;
            animation-name: scroll; animation-timing-function: linear; animation-iteration-count: infinite;
        }
        .marquee-wrapper:hover .marquee-content { animation-play-state: paused; }
        .marquee-item-group { display: flex; align-items: center; flex-shrink: 0; min-width: 100%; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-2 sm:p-4 md:p-6">
    <div class="max-w-4xl mx-auto">
        <div class="mb-4 text-center">
            <h1 class="flex items-center justify-center text-2xl sm:text-3xl md:text-4xl font-bold text-indigo-800 mb-2 md:mb-3">
                <img src="上岐國小_校徽_202409_彩色.jpg" alt="僑平校徽" class="h-8 w-8 sm:h-10 sm:w-10 md:h-12 md:w-12 mr-2 object-contain" onerror="this.onerror=null; this.outerHTML='<span class=\'mr-2\'>📚</span>';">
                僑平國小 605 聯絡簿
            </h1>
            <div class="text-sm sm:text-base md:text-lg font-medium flex items-center justify-center gap-2 flex-wrap" id="dateInfo">
                <span class="bg-red-100 text-red-800 px-3 py-1.5 rounded-full shadow-sm" id="semesterInfo">115學年第一學期</span>
                <span class="bg-blue-100 text-blue-800 px-3 py-1.5 rounded-full shadow-sm" id="weekInfo">第1週</span>
                <button onclick="showDatePicker()" class="bg-green-100 hover:bg-green-200 text-green-800 px-3 py-1.5 rounded-full shadow-sm transition-colors cursor-pointer font-medium" id="dateOnly" title="點擊選擇日期">2026年8月31日</button>
                <span class="bg-purple-100 text-purple-800 px-3 py-1.5 rounded-full shadow-sm" id="weekdayOnly">星期一</span>
            </div>
            
            <div class="flex flex-wrap gap-2 sm:gap-3 justify-center mt-5">
                <button onclick="previousDay()" class="group flex-1 sm:flex-none relative bg-gradient-to-r from-slate-500 to-slate-600 hover:from-slate-600 hover:to-slate-700 text-white px-4 py-2.5 sm:px-6 sm:py-3 rounded-xl font-medium transition-all shadow-md hover:shadow-lg flex items-center justify-center space-x-1 sm:space-x-2">
                    <span class="text-base sm:text-lg group-hover:-translate-x-1 transition-transform">⬅️</span>
                    <span>前一天</span>
                </button>
                <button onclick="today()" class="group flex-1 sm:flex-none relative bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white px-4 py-2.5 sm:px-6 sm:py-3 rounded-xl font-medium transition-all shadow-md hover:shadow-lg flex items-center justify-center space-x-1 sm:space-x-2">
                    <span class="text-base sm:text-lg group-hover:scale-110 transition-transform">📅</span>
                    <span>今天</span>
                </button>
                <button onclick="nextDay()" class="group flex-1 sm:flex-none relative bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white px-4 py-2.5 sm:px-6 sm:py-3 rounded-xl font-medium transition-all shadow-md hover:shadow-lg flex items-center justify-center space-x-1 sm:space-x-2">
                    <span>後一天</span>
                    <span class="text-base sm:text-lg group-hover:translate-x-1 transition-transform">➡️</span>
                </button>
            </div>
        </div>

        <div id="countdownMarquee" style="display: none;" class="max-w-4xl mx-auto mt-2 mb-4 bg-yellow-50 border-2 border-yellow-200 rounded-xl shadow-sm py-2 px-3 sm:px-5 marquee-wrapper cursor-pointer hover:bg-yellow-100 transition-colors" title="點擊查看所有跑馬燈" onclick="showMarqueeList()">
            <div class="text-base sm:text-lg md:text-xl font-bold text-yellow-800 w-full flex" id="marqueeText"></div>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-4 sm:p-6 md:p-8 mb-6">
            <div class="mb-4 sm:mb-8">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-6">
                    <div class="flex items-center flex-wrap gap-2">
                        <span class="text-2xl sm:text-3xl shrink-0">📝</span>
                        <h2 id="homeworkTitle" class="font-bold text-gray-800 text-xl sm:text-2xl md:text-3xl">今日作業</h2>
                        <!-- 靜默更新：不再顯示 syncIndicator 區塊 -->
                    </div>
                    
                    <button id="editModeBtn" onclick="toggleEditMode()" class="w-full sm:w-auto bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white px-5 py-2.5 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 transform sm:hover:scale-105 flex justify-center items-center space-x-2">
                        <span id="editIcon" class="text-lg">🔐</span>
                        <span id="editText" class="font-medium text-base">編輯模式</span>
                    </button>
                </div>
                
                <div id="homeworkContainer" class="space-y-4">
                    <div id="sortModeIndicator" class="sort-mode-indicator text-sm sm:text-base" style="display: none;">🔄 拖拽排序模式：拖動作業項目來調整順序</div>
                    <div id="confirmedSection"><div id="confirmedList" class="space-y-3 sm:space-y-4"></div></div>
                    <div id="editingSection" style="display: none;">
                        <div class="flex items-center mb-3">
                            <div class="h-px bg-gray-300 flex-1"></div>
                            <span class="px-3 text-xs sm:text-sm font-medium text-gray-500 bg-gray-50 rounded-full border border-gray-200">編輯中作業</span>
                            <div class="h-px bg-gray-300 flex-1"></div>
                        </div>
                        <div id="editingList" class="space-y-3 sm:space-y-4"></div>
                    </div>
                    <div id="loadingState" class="text-center py-12 text-gray-500" style="display: none;">
                        <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-4"></div>
                        <p class="text-lg font-medium mb-2">載入中...</p>
                    </div>
                    <div id="emptyState" class="text-center py-12 text-gray-500">
                        <span class="text-5xl sm:text-6xl mb-4 block opacity-80">📝</span>

                    </div>
                </div>

                <button id="addHomeworkBtn" onclick="addHomework()" class="mt-6 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white px-6 py-3 rounded-xl font-medium transition-all shadow-lg w-full justify-center sm:w-auto text-lg items-center" style="display: none;">
                    <span class="text-xl mr-2">➕</span> 新增作業
                </button>
                
                <div id="marqueeEditSection" class="mt-8 pt-6 border-t-2 border-gray-100" style="display: none;">
                    <div class="flex items-center mb-4">
                        <span class="text-xl sm:text-2xl shrink-0 mr-2">📢</span>
                        <h2 class="font-bold text-gray-800 text-lg sm:text-xl md:text-2xl">跑馬燈 / 活動設定</h2>
                    </div>
                    <div class="mb-4 bg-yellow-50 p-4 rounded-xl border border-yellow-200 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                        <div class="font-medium text-yellow-800 flex items-center"><span class="mr-2">🏃</span> 移動速度</div>
                        <div class="flex items-center gap-3 w-full sm:w-auto">
                            <span class="text-sm text-yellow-600 font-medium">快</span>
                            <input type="range" min="150" max="400" value="200" id="marqueeSpeedSlider" class="flex-1 sm:w-32 h-2 bg-yellow-200 rounded-lg appearance-none cursor-pointer" oninput="updateMarqueeSpeed(this.value)">
                            <span class="text-sm text-yellow-600 font-medium">慢</span>
                        </div>
                    </div>
                    <div id="globalEventsList" class="space-y-3"></div>
                    <button onclick="addGlobalEvent()" class="mt-4 bg-yellow-100 hover:bg-yellow-200 text-yellow-800 px-4 py-3 rounded-xl font-medium transition-colors flex items-center justify-center w-full border border-yellow-300 shadow-sm border-dashed text-base">
                        <span class="text-xl mr-2">➕</span> 新增跑馬燈訊息
                    </button>
                </div>
            </div>
        </div>
        
        <footer class="text-center text-slate-500 text-sm font-medium mt-2 mb-6 tracking-wide opacity-80">
            大榮老師製作 &copy; 2026 | Version 1.9 (v1.9)
        </footer>
    </div>

    <script>
        let currentDate = new Date();
        let homeworkData = []; 
        let editMode = false;
        let isSaving = false;
        
        let globalConfig = { marqueeSpeed: 200 }; 
        let globalEvents = [
            { id: 'e1', type: 'countdown', name: '第一次定期評量', date: '2026-11-03', enabled: true },
            { id: 'e2', type: 'countdown', name: '校慶活動', date: '2026-12-12', enabled: true }
        ];
        
        const firstSemesterStart = new Date('2026-08-31');
        const firstSemesterEnd = new Date('2027-01-20');
        const secondSemesterStart = new Date('2027-02-11');
        const secondSemesterEnd = new Date('2027-06-30');

        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwQGDUGy9WWRTRYarvab7F-bFZBqeVaT2mhu4lC0L7OQ-iwoTUU1bexXJLSXaSfiil_Qg/exec';

        const CACHE_CONFIG = {
            TTL: 12 * 60 * 60 * 1000, 
            CLASS_ID: '605',
            VERSION: '1.19.0', 
            BACKGROUND_UPDATE_INTERVAL: 5000, 
            BACKGROUND_UPDATE_ENABLED: true 
        };

        const memoryCache = new Map();
        let backgroundUpdateTimer = null;
        let isBackgroundUpdating = false;
        let lastBackgroundUpdate = 0;
        let lastSyncedLocalData = null;
        let lastSyncedGlobalData = null;

        function dateKeyISO(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        // 解析後端儲存的純文字 (支援多行直接轉換)
        function parseRawData(rawData) {
            if (!rawData) return [];
            if (typeof rawData === 'string') {
                const trimmed = rawData.trim();
                if ((trimmed.startsWith('[') && trimmed.endsWith(']')) || (trimmed.startsWith('{') && trimmed.endsWith('}'))) {
                    try { return JSON.parse(trimmed); } catch(e) {}
                    try { return JSON.parse(trimmed.replace(/[\n\r\t]/g, ' ')); } catch(e) {}
                }
                return trimmed.split('\n').map(s => s.trim()).filter(s => s !== '');
            }
            return rawData;
        }

        function calculateStableHash(rawData) {
            let parsedData = parseRawData(rawData);
            if (!Array.isArray(parsedData)) return 'empty';
            const stableContent = parsedData.map(item => {
                if (typeof item === 'string') return { c: item, s: '其它', st: 'confirmed' };
                else return { c: String(item.text || item.content || '').trim(), s: item.subject || '國語', st: 'confirmed' };
            });
            const str = JSON.stringify(stableContent);
            let hash = 0;
            for (let i = 0; i < str.length; i++) { hash = ((hash << 5) - hash) + str.charCodeAt(i); hash = hash & hash; }
            return hash.toString(36);
        }

        function normalizeHomeworkData(rawData) {
            let parsedData = parseRawData(rawData);
            if (!Array.isArray(parsedData)) return [];
            return parsedData.map((item, index) => {
                let content = '', subject = '國語', status = 'confirmed';
                if (typeof item === 'string') { content = item; subject = '其它'; } 
                else if (item && typeof item === 'object') {
                    content = (item.text || item.content || '').toString().trim();
                    subject = item.subject || '國語';
                    status = (item.confirmed === true || item.status === 'confirmed') ? 'confirmed' : 'editing';
                }
                if (content) return new HomeworkItem(`hw_${Date.now()}_${index}`, subject, content, status);
                return null;
            }).filter(Boolean);
        }

        async function performBackgroundUpdate() {
            if (isBackgroundUpdating) return;
            const now = Date.now();
            if (now - lastBackgroundUpdate < CACHE_CONFIG.BACKGROUND_UPDATE_INTERVAL) return;
            isBackgroundUpdating = true;
            lastBackgroundUpdate = now;

            try {
                const dateKey = dateKeyISO(currentDate);

                // 1. 自動儲存 (完全靜默，無任何提示)
                if (editMode) {
                    const currentLocalData = JSON.stringify(homeworkData.map(h => ({ c: h.content, s: h.subject, st: h.status })));
                    const currentGlobalData = JSON.stringify({ events: globalEvents, config: globalConfig });

                    if (lastSyncedLocalData !== null && lastSyncedLocalData !== currentLocalData) {
                        await saveHomeworkInstantly();
                    }
                    if (lastSyncedGlobalData !== null && lastSyncedGlobalData !== currentGlobalData) {
                        await saveGlobalEventsInstantly();
                    }
                    lastSyncedLocalData = currentLocalData; lastSyncedGlobalData = currentGlobalData;
                }

                // 2. 雲端抓取與比對 (完全靜默)
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 8000);
                
                const hwParams = new URLSearchParams({ action: 'load', dateKey, classId: CACHE_CONFIG.CLASS_ID, token: 'homework2025', _t: Date.now() });
                const hwPromise = fetch(`${APPS_SCRIPT_URL}?${hwParams}`, { signal: controller.signal, cache: 'no-store' }).then(res => res.json());
                
                const gbParams = new URLSearchParams({ action: 'loadGlobal', classId: CACHE_CONFIG.CLASS_ID, token: 'homework2025', _t: Date.now() });
                const gbPromise = fetch(`${APPS_SCRIPT_URL}?${gbParams}`, { signal: controller.signal, cache: 'no-store' }).then(res => res.json());

                const [cloudResult, globalResult] = await Promise.all([hwPromise, gbPromise]);
                clearTimeout(timeoutId);

                // 3. 靜默套用變更 (精準記憶焦點，不打斷輸入)
                let needRedrawHw = false;
                const cloudHash = calculateStableHash(cloudResult.data || []);
                const localHash = calculateStableHash(homeworkData.map(h => ({ content: h.content, subject: h.subject })));
                
                if (cloudHash !== localHash && cloudResult.data) {
                    needRedrawHw = true;
                }

                let needRedrawGb = false;
                if (globalResult.success && globalResult.data) {
                    const fetchedString = typeof globalResult.data === 'string' ? globalResult.data : JSON.stringify(globalResult.data);
                    const localGbStr = JSON.stringify({events: globalEvents, config: globalConfig});
                    if (fetchedString !== localGbStr && lastSyncedGlobalData !== fetchedString) {
                        needRedrawGb = true;
                    }
                }

                if (needRedrawHw || needRedrawGb) {
                    const activeElement = document.activeElement;
                    let focusedId = null, selectionStart = 0, selectionEnd = 0, activeField = '';

                    if (editMode && activeElement && activeElement.tagName === 'INPUT') {
                        selectionStart = activeElement.selectionStart || 0; selectionEnd = activeElement.selectionEnd || 0;
                        const hwItem = activeElement.closest('.homework-item');
                        if (hwItem) { focusedId = hwItem.dataset.homeworkId; activeField = 'hw'; }
                        const gbItem = activeElement.closest('.global-sortable-item');
                        if (gbItem) { 
                            focusedId = gbItem.dataset.eventId; 
                            if(activeElement.placeholder.includes('名稱')) activeField = 'name';
                            else if(activeElement.type === 'date') activeField = 'date';
                            else activeField = 'content';
                        }
                    }

                    if (needRedrawHw) {
                        homeworkData = normalizeHomeworkData(cloudResult.data);
                        renderAllHomework();
                    }
                    if (needRedrawGb) {
                        const parsed = parseRawData(globalResult.data);
                        if (parsed.events) globalEvents = parsed.events;
                        if (parsed.config) globalConfig = parsed.config;
                        if (editMode) renderGlobalEventsEditor();
                        updateCountdown(new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()).getTime());
                    }

                    // 瞬間還原焦點
                    if (editMode && focusedId) {
                        let newTarget = null;
                        if (activeField === 'hw') newTarget = document.querySelector(`[data-homework-id="${focusedId}"] input[type="text"]`);
                        else if (activeField === 'name') newTarget = document.querySelector(`[data-event-id="${focusedId}"] input[placeholder*="名稱"]`);
                        else if (activeField === 'date') newTarget = document.querySelector(`[data-event-id="${focusedId}"] input[type="date"]`);
                        else if (activeField === 'content') newTarget = document.querySelector(`[data-event-id="${focusedId}"] input[placeholder*="宣導"]`);
                        
                        if (newTarget) {
                            newTarget.focus();
                            try { newTarget.setSelectionRange(selectionStart, selectionEnd); } catch(e){}
                        }
                    }
                }
            } catch (error) {
                // Ignore Abort errors completely
            } finally {
                isBackgroundUpdating = false;
            }
        }

        class HomeworkItem {
            constructor(id, subject, content, status = 'editing') {
                this.id = id || `hw_${Date.now()}`;
                this.subject = subject; this.content = content; this.status = status;
                this.timestamp = new Date().toISOString();
            }
        }

        function renderHomeworkItem(homework) {
            const item = document.createElement('div');
            item.className = 'homework-item rounded-xl p-3 sm:p-4 shadow-sm homework-editing flex flex-col gap-3';
            item.dataset.homeworkId = homework.id;
            item.innerHTML = `
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
                    <select class="w-full sm:w-auto bg-white border border-gray-300 rounded-lg px-3 py-2 text-base font-medium focus:ring-2 focus:ring-indigo-500" onchange="updateHomeworkSubject('${homework.id}', this.value)">
                        ${['國語','數學','自然','社會','週記','作文','其它'].map(s => `<option value="${s}" ${homework.subject === s ? 'selected' : ''}>${s}</option>`).join('')}
                    </select>
                    <div class="flex space-x-2 self-end sm:self-auto shrink-0">
                        <button onclick="confirmHomework('${homework.id}')" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-medium transition-colors ${homework.content.trim() ? '' : 'opacity-50'}" ${homework.content.trim() ? '' : 'disabled'}>確認</button>
                        <button onclick="deleteHomework('${homework.id}')" class="text-red-500 bg-red-50 hover:bg-red-100 px-3 py-2 rounded-lg transition-colors text-lg">🗑️</button>
                    </div>
                </div>
                <input type="text" value="${homework.content}" placeholder="請輸入作業內容..." 
                       class="w-full bg-white border border-gray-300 rounded-lg px-4 py-3 text-gray-800 font-medium text-lg sm:text-xl focus:ring-2 focus:ring-indigo-500 transition-all"
                       oninput="updateHomeworkContent('${homework.id}', this.value)"
                       onkeypress="if(event.key==='Enter') confirmHomework('${homework.id}')">
            `;
            return item;
        }

        function renderHomeworkItemOptimized(homework, sequenceNumber) {
            const item = document.createElement('div');
            item.className = 'homework-item rounded-xl p-3 sm:p-4 shadow-sm homework-confirmed flex items-center justify-between';
            item.dataset.homeworkId = homework.id;
            
            if (editMode) {
                item.classList.add('sortable-item');
                item.addEventListener('dragstart', handleDragStart); item.addEventListener('dragend', handleDragEnd);
                item.addEventListener('dragover', handleDragOver); item.addEventListener('drop', handleDrop);
            }
            
            const displayText = homework.subject === '其它' ? `${sequenceNumber}. ${homework.content}` : `${sequenceNumber}. ${{'國語':'國','數學':'數','社會':'社','自然':'自'}[homework.subject] || homework.subject}${homework.content}`;
            const dragHandle = editMode ? `<div class="drag-handle mr-3 text-2xl cursor-grab select-none shrink-0" draggable="false" onmousedown="this.closest('.sortable-item').setAttribute('draggable', 'true')" ontouchstart="this.closest('.sortable-item').setAttribute('draggable', 'true')">⋮⋮</div>` : '';
            
            item.innerHTML = `
                <div class="flex items-center flex-1 min-w-0 pr-2">
                    ${dragHandle}
                    <div class="text-gray-800 font-medium text-lg sm:text-xl md:text-2xl leading-snug break-words">${displayText}</div>
                </div>
                <div class="flex space-x-2 shrink-0" ${editMode ? '' : 'style="display: none;"'}>
                    <button onclick="editHomework('${homework.id}')" class="text-blue-500 bg-blue-50 hover:bg-blue-100 p-2 rounded-lg text-lg">✏️</button>
                    <button onclick="deleteHomework('${homework.id}')" class="text-red-500 bg-red-50 hover:bg-red-100 p-2 rounded-lg text-lg">🗑️</button>
                </div>
            `;
            return item;
        }

        function renderAllHomework(isLoading = false) {
            const el = id => document.getElementById(id);
            if (isLoading) {
                el('confirmedSection').style.display = 'none'; el('editingSection').style.display = 'none';
                el('emptyState').style.display = 'none'; el('loadingState').style.display = 'block';
                return;
            }
            el('loadingState').style.display = 'none';
            
            const confirmed = homeworkData.filter(hw => hw.status === 'confirmed');
            const editing = homeworkData.filter(hw => hw.status === 'editing');
            
            el('confirmedList').innerHTML = ''; el('editingList').innerHTML = '';
            confirmed.forEach((hw, idx) => el('confirmedList').appendChild(renderHomeworkItemOptimized(hw, idx + 1)));
            editing.forEach(hw => el('editingList').appendChild(renderHomeworkItem(hw)));
            
            el('confirmedSection').style.display = confirmed.length > 0 ? 'block' : 'none';
            el('editingSection').style.display = (editing.length > 0 && editMode) ? 'block' : 'none';
            el('emptyState').style.display = (confirmed.length === 0 && (!editMode || editing.length === 0)) ? 'block' : 'none';
        }

        let draggedElement = null, draggedHomeworkId = null;
        function handleDragStart(e) {
            const item = e.target.closest('.sortable-item'); if (!item) return;
            draggedElement = item; draggedHomeworkId = item.dataset.homeworkId;
            item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
        }
        function handleDragEnd(e) {
            if (draggedElement) { draggedElement.classList.remove('dragging'); draggedElement.setAttribute('draggable', 'false'); }
            document.querySelectorAll('.sortable-item').forEach(i => i.classList.remove('drag-over'));
            draggedElement = null; draggedHomeworkId = null;
        }
        function handleDragOver(e) {
            e.preventDefault(); if (!draggedElement) return;
            const target = e.target.closest('.sortable-item');
            if (target && target !== draggedElement) {
                document.querySelectorAll('.sortable-item').forEach(i => i.classList.remove('drag-over')); target.classList.add('drag-over');
            }
        }
        function handleDrop(e) {
            e.preventDefault(); if (!draggedElement || !draggedHomeworkId) return;
            const target = e.target.closest('.sortable-item');
            if (target && target !== draggedElement) {
                const draggedIdx = homeworkData.findIndex(hw => hw.id === draggedHomeworkId);
                const targetIdx = homeworkData.findIndex(hw => hw.id === target.dataset.homeworkId);
                if (draggedIdx > -1 && targetIdx > -1) {
                    const item = homeworkData.splice(draggedIdx, 1)[0];
                    homeworkData.splice(targetIdx, 0, item); renderAllHomework();
                }
            }
            document.querySelectorAll('.sortable-item').forEach(i => i.classList.remove('drag-over'));
        }

        function updateHomeworkSubject(id, subject) { const hw = homeworkData.find(h => h.id === id); if(hw) hw.subject = subject; }
        function updateHomeworkContent(id, content) {
            const hw = homeworkData.find(h => h.id === id);
            if (hw) {
                hw.content = content;
                const btn = document.querySelector(`[data-homework-id="${id}"] button[onclick*="confirmHomework"]`);
                if(btn) { btn.disabled = !content.trim(); btn.className = `bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded-lg font-medium transition-colors ${content.trim() ? '' : 'opacity-50'}`; }
            }
        }
        function confirmHomework(id) { const hw = homeworkData.find(h => h.id === id); if (hw && hw.content.trim()) { hw.status = 'confirmed'; renderAllHomework(); } }
        function editHomework(id) { if(editMode){ const hw = homeworkData.find(h => h.id === id); if(hw) { hw.status = 'editing'; renderAllHomework(); setTimeout(() => document.querySelector(`[data-homework-id="${id}"] input[type="text"]`)?.focus(), 50); } } }
        function deleteHomework(id) { if(editMode){ const idx = homeworkData.findIndex(h => h.id === id); if(idx>-1) { homeworkData.splice(idx, 1); renderAllHomework(); } } }
        function addHomework() { if(editMode){ const hw = new HomeworkItem(); homeworkData.push(hw); renderAllHomework(); setTimeout(() => document.querySelector(`[data-homework-id="${hw.id}"] input[type="text"]`)?.focus(), 50); } }

        function renderGlobalEventsEditor() {
            const container = document.getElementById('globalEventsList'); if (!container) return;
            container.innerHTML = globalEvents.map(ev => {
                const isChecked = ev.enabled !== false;
                const typeHtml = `<select onchange="updateGlobalEventField('${ev.id}', 'type', this)" class="bg-white border border-gray-300 rounded-lg px-2 py-2 text-sm font-medium w-full sm:w-auto"><option value="countdown" ${ev.type === 'countdown' ? 'selected' : ''}>活動倒數</option><option value="message" ${ev.type === 'message' ? 'selected' : ''}>純文字訊息</option></select>`;
                const inputHtml = ev.type === 'countdown' 
                    ? `<input type="text" value="${ev.name || ''}" placeholder="活動名稱..." oninput="updateGlobalEventField('${ev.id}', 'name', this)" class="flex-1 w-full bg-white border border-gray-300 rounded-lg px-3 py-2"><input type="date" value="${ev.date || ''}" onchange="updateGlobalEventField('${ev.id}', 'date', this)" class="bg-white w-full sm:w-auto border border-gray-300 rounded-lg px-3 py-2">`
                    : `<input type="text" value="${ev.content || ''}" placeholder="宣導訊息..." oninput="updateGlobalEventField('${ev.id}', 'content', this)" class="flex-1 w-full bg-white border border-gray-300 rounded-lg px-3 py-2">`;
                return `
                <div class="global-sortable-item bg-white rounded-xl p-4 border border-gray-200 shadow-sm flex flex-col sm:flex-row gap-3 items-start sm:items-center ${isChecked ? '' : 'opacity-50'}" data-event-id="${ev.id}">
                    <div class="flex items-center shrink-0 w-full sm:w-auto">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="updateGlobalEventField('${ev.id}', 'enabled', this)" class="w-5 h-5 text-yellow-600 rounded cursor-pointer mr-3">
                    </div>
                    ${typeHtml} ${inputHtml}
                    <button onclick="removeGlobalEvent('${ev.id}')" class="text-red-500 bg-red-50 hover:bg-red-100 p-2 rounded-lg ml-auto sm:ml-0 mt-2 sm:mt-0">🗑️</button>
                </div>`;
            }).join('');
        }
        function updateGlobalEventField(id, field, el) {
            const ev = globalEvents.find(e => e.id === id);
            if (ev) {
                ev[field] = el.type === 'checkbox' ? el.checked : el.value;
                if (field === 'type' && el.value === 'countdown' && !ev.date) { ev.date = dateKeyISO(new Date()); ev.name = ev.content || '新活動'; }
                if (field === 'enabled' || field === 'type') renderGlobalEventsEditor();
                updateCountdown(new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()).getTime());
            }
        }
        function addGlobalEvent() { globalEvents.push({ id: 'ev_' + Date.now(), type: 'message', content: '新訊息', enabled: true }); renderGlobalEventsEditor(); }
        function removeGlobalEvent(id) { globalEvents = globalEvents.filter(e => e.id !== id); renderGlobalEventsEditor(); }
        function updateMarqueeSpeed(val) { globalConfig.marqueeSpeed = parseInt(val, 10); updateCountdown(new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()).getTime()); }

        async function saveToGoogleSheets(dateKey, data) {
            try {
                const fd = new FormData();
                fd.append('action', 'save'); fd.append('dateKey', dateKey); 
                fd.append('classId', CACHE_CONFIG.CLASS_ID); fd.append('data', JSON.stringify(data)); 
                fd.append('token', 'homework2025'); fd.append('userAgent', navigator.userAgent);
                const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: fd, cache: 'no-store' });
                return res.ok;
            } catch (e) { return false; }
        }

        async function saveHomeworkInstantly() {
            if (isSaving) return; isSaving = true;
            try {
                const dateKey = dateKeyISO(currentDate);
                const legacyData = homeworkData.map(hw => ({ text: hw.content, subject: hw.subject, confirmed: hw.status === 'confirmed' }));
                await saveToGoogleSheets(dateKey, legacyData);
            } finally { isSaving = false; }
        }
        
        async function saveGlobalEventsInstantly() {
            try {
                const fd = new FormData(); fd.append('action', 'saveGlobal'); fd.append('classId', CACHE_CONFIG.CLASS_ID);
                fd.append('data', JSON.stringify({ events: globalEvents, config: globalConfig })); fd.append('token', 'homework2025');
                await fetch(APPS_SCRIPT_URL, { method: 'POST', body: fd, cache: 'no-store' });
            } catch(e) {}
        }

        async function initialLoad() {
            renderAllHomework(true);
            try {
                const dateKey = dateKeyISO(currentDate);
                const res = await fetch(`${APPS_SCRIPT_URL}?action=load&dateKey=${dateKey}&classId=${CACHE_CONFIG.CLASS_ID}&token=homework2025`);
                const result = await res.json();
                if (dateKeyISO(currentDate) === dateKey) { homeworkData = normalizeHomeworkData(result.data); renderAllHomework(); }
            } catch(e) { renderAllHomework(); }
        }

        async function toggleEditMode() {
            if (!editMode) { showCustomPasswordDialog(); return; }

            // 1. 清理空白作業，狀態全轉為確認
            homeworkData = homeworkData.filter(h => h.content.trim() || h.status !== 'editing');
            homeworkData.forEach(hw => { if (hw.status === 'editing') hw.status = 'confirmed'; });

            // 2. 樂觀 UI 切換 (極速體驗，畫面瞬間變回預覽模式)
            editMode = false;
            updateEditModeUI();
            renderAllHomework();

            // 3. 靜默在背景寫入資料庫
            try {
                await saveHomeworkInstantly();
                await saveGlobalEventsInstantly();
            } catch (e) {
                console.error("背景儲存發生錯誤", e);
            }
        }

        function updateEditModeUI() {
            const btn = document.getElementById('editModeBtn');
            if (editMode) {
                document.getElementById('editIcon').textContent = '🔓'; document.getElementById('editText').textContent = '退出編輯';
                btn.className = 'w-full sm:w-auto bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white px-5 py-2.5 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 flex justify-center items-center space-x-2';
                document.getElementById('addHomeworkBtn').style.display = 'flex';
                document.getElementById('marqueeEditSection').style.display = 'block';
                document.getElementById('sortModeIndicator').style.display = 'block';
                renderGlobalEventsEditor(); 
                if(backgroundUpdateTimer) { clearInterval(backgroundUpdateTimer); backgroundUpdateTimer=null; }
            } else {
                document.getElementById('editIcon').textContent = '🔐'; document.getElementById('editText').textContent = '編輯模式';
                btn.className = 'w-full sm:w-auto bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white px-5 py-2.5 rounded-xl shadow-lg hover:shadow-xl transition-all duration-300 flex justify-center items-center space-x-2';
                document.getElementById('addHomeworkBtn').style.display = 'none';
                document.getElementById('marqueeEditSection').style.display = 'none';
                document.getElementById('sortModeIndicator').style.display = 'none';
                backgroundUpdateTimer = setInterval(() => { if (document.visibilityState === 'visible') performBackgroundUpdate(); }, CACHE_CONFIG.BACKGROUND_UPDATE_INTERVAL);
            }
        }

        function showCustomPasswordDialog() {
            const overlay = document.createElement('div'); overlay.className = 'password-dialog-overlay';
            overlay.innerHTML = `<div class="bg-white rounded-xl p-6 shadow-2xl max-w-sm w-full mx-4"><h3 class="text-xl font-bold mb-4">🔐 請輸入密碼</h3><input type="password" id="customPasswordInput" class="w-full border border-gray-300 rounded-lg p-3 text-center text-lg mb-4 outline-none focus:border-indigo-500"><div class="flex gap-3"><button onclick="document.querySelector('.password-dialog-overlay').remove()" class="flex-1 bg-gray-200 text-gray-800 py-2.5 rounded-lg font-medium">取消</button><button onclick="confirmPassword()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-lg font-medium">確認</button></div></div>`;
            document.body.appendChild(overlay);
            setTimeout(() => { const i = document.getElementById('customPasswordInput'); i.focus(); i.onkeypress = e => { if(e.key==='Enter') confirmPassword(); }; }, 100);
        }
        function confirmPassword() {
            const input = document.getElementById('customPasswordInput');
            if (input?.value === '0944') {
                editMode = true; updateEditModeUI(); document.querySelector('.password-dialog-overlay').remove();
                renderAllHomework();
            } else { alert('密碼錯誤！'); input.value = ''; input.focus(); }
        }

        function updateCountdown(currentDayTime) {
            const countdownMarquee = document.getElementById('countdownMarquee');
            const marqueeText = document.getElementById('marqueeText');
            if (!globalEvents || globalEvents.length === 0) { countdownMarquee.style.display = 'none'; return; }

            let msgs = [];
            for (const ev of globalEvents) {
                if (ev.enabled === false) continue;
                if (ev.type === 'message' && ev.content?.trim()) { msgs.push(`📢 ${ev.content}`); } 
                else if (ev.type === 'countdown' && ev.date && ev.name) {
                    const [y, m, d] = ev.date.split('-');
                    const eDay = new Date(parseInt(y), parseInt(m)-1, parseInt(d)).getTime();
                    const tDay = new Date(new Date(currentDayTime).getFullYear(), new Date(currentDayTime).getMonth(), new Date(currentDayTime).getDate()).getTime();
                    if (eDay >= tDay) {
                        const days = Math.floor((eDay - tDay) / 86400000);
                        if (days === 0) msgs.push(`📢 🌟 提醒：【${ev.name}】就是今天！祝順利！ 💪`);
                        else msgs.push(`📢 提醒：距離【${ev.name}】剩下 <span class="text-xl md:text-2xl text-red-500 font-black mx-1">${days}</span> 天！`);
                    }
                }
            }

            if (msgs.length > 0) {
                countdownMarquee.style.display = 'flex';
                const baseMsg = msgs.join('<span class="mx-6 text-yellow-400 font-normal">|</span>') + '<span class="mx-6 text-yellow-400 font-normal">|</span>';
                const copies = 20; const speedSetting = Math.max(150, Math.min(400, globalConfig.marqueeSpeed || 200));
                marqueeText.style.animationDuration = `${(baseMsg.length * (copies/2) / 300) * speedSetting}s`;
                const gHtml = `<div class="marquee-item-group">${Array(copies).fill(baseMsg).join('')}</div>`;
                marqueeText.innerHTML = gHtml + gHtml;
            } else { countdownMarquee.style.display = 'none'; }
        }

        function updateDateDisplay() {
            const stripTime = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
            const curr = stripTime(currentDate);
            let semInfo = '暑假', weekNum = 1;
            
            if (curr >= stripTime(firstSemesterStart) && curr <= stripTime(firstSemesterEnd)) {
                semInfo = '115學年第一學期'; weekNum = Math.max(1, Math.min(21, Math.floor((curr - stripTime(new Date(2026, 7, 30))) / 86400000 / 7) + 1));
            } else if (curr >= stripTime(secondSemesterStart) && curr <= stripTime(secondSemesterEnd)) {
                semInfo = '115學年第二學期'; weekNum = Math.max(1, Math.min(21, Math.floor((curr - stripTime(new Date(2027, 1, 7))) / 86400000 / 7) + 1));
            } else if (curr > stripTime(firstSemesterEnd) && curr < stripTime(secondSemesterStart)) semInfo = '115學年寒假';

            document.getElementById('semesterInfo').textContent = semInfo; document.getElementById('weekInfo').textContent = `第${weekNum}週`;
            document.getElementById('dateOnly').textContent = `${currentDate.getFullYear()}年${currentDate.getMonth() + 1}月${currentDate.getDate()}日`;
            document.getElementById('weekdayOnly').textContent = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][currentDate.getDay()];
            document.getElementById('homeworkTitle').textContent = curr === stripTime(new Date()) ? '今日作業' : `${currentDate.getMonth() + 1}月${currentDate.getDate()}日 作業`;
            updateCountdown(curr);
            initialLoad();
        }

        function moveDay(step) {
            do {
                currentDate.setDate(currentDate.getDate() + step);
                if (currentDate < firstSemesterStart) { currentDate = new Date(firstSemesterStart); break; }
                if (currentDate > secondSemesterEnd) { currentDate = new Date(secondSemesterEnd); break; }
            } while (currentDate.getDay() === 0 || currentDate.getDay() === 6);
            updateDateDisplay();
        }
        function previousDay() { moveDay(-1); } function nextDay() { moveDay(1); } function today() { currentDate = new Date(); updateDateDisplay(); }
        
        function showDatePicker() {
            const overlay = document.createElement('div'); overlay.className = 'date-picker-overlay';
            overlay.innerHTML = `<div class="date-picker-dialog"><h3 class="text-xl font-bold mb-4">📅 選擇日期</h3><input type="date" id="dpInput" class="date-picker-input" value="${dateKeyISO(currentDate)}" min="${dateKeyISO(firstSemesterStart)}" max="${dateKeyISO(secondSemesterEnd)}"><div class="flex gap-3"><button onclick="document.querySelector('.date-picker-overlay').remove()" class="flex-1 bg-gray-200 text-gray-800 py-2.5 rounded-lg">取消</button><button onclick="confirmDatePicker()" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-lg">確認</button></div></div>`;
            document.body.appendChild(overlay);
        }
        function confirmDatePicker() {
            const val = document.getElementById('dpInput')?.value; if (!val) return;
            const d = new Date(val + 'T12:00:00');
            if (d < firstSemesterStart || d > secondSemesterEnd) { alert('超出學期範圍！'); return; }
            if (d.getDay() === 0 || d.getDay() === 6) { alert('週末沒有上課！'); return; }
            currentDate = d; document.querySelector('.date-picker-overlay').remove(); updateDateDisplay();
        }
        function showMarqueeList() {
            if (!globalEvents || globalEvents.length===0) return;
            let html = globalEvents.filter(e => e.enabled !== false).map(ev => {
                if(ev.type === 'message') return `<div class="p-4 bg-gray-50 rounded-xl border border-gray-200 mb-3 flex items-start gap-3"><span class="text-2xl">📢</span><span class="text-gray-800 text-lg sm:text-xl font-medium">${ev.content}</span></div>`;
                const eDay = new Date(ev.date).getTime(); const tDay = new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()).getTime();
                if(eDay >= tDay) {
                    const d = Math.floor((eDay-tDay)/86400000);
                    return `<div class="p-4 bg-yellow-50 rounded-xl border border-yellow-300 mb-3"><div class="flex justify-between border-b border-yellow-200 pb-2 mb-2"><span class="text-yellow-900 font-bold text-lg sm:text-xl">📌 ${ev.name}</span><span class="bg-yellow-200 text-yellow-800 px-2 py-1 rounded text-sm font-bold">${ev.date.replace(/-/g,'/')}</span></div><div class="flex items-start gap-3"><span class="text-2xl">📅</span><span class="text-yellow-900 font-medium text-lg sm:text-xl">${d===0?'🌟 <strong class="text-red-600">就是今天！</strong>祝順利！':`距離現在還有 <strong class="text-2xl text-red-500 mx-1">${d}</strong> 天`}</span></div></div>`;
                } return '';
            }).join('');
            if(!html) html = `<div class="text-center text-gray-500 py-8 text-lg font-medium">目前沒有項目 📭</div>`;
            const overlay = document.createElement('div'); overlay.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[10000] p-4';
            overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
            overlay.innerHTML = `<div class="bg-white w-full max-w-2xl max-h-[85vh] flex flex-col rounded-2xl overflow-hidden"><div class="p-5 border-b flex justify-between items-center bg-yellow-50"><h3 class="text-xl font-bold text-yellow-900">📋 所有跑馬燈</h3><button onclick="this.closest('.fixed').remove()" class="text-2xl px-2">&times;</button></div><div class="p-4 overflow-y-auto flex-1 bg-white">${html}</div></div>`;
            document.body.appendChild(overlay);
        }

        window.addEventListener('load', () => {
            currentDate = new Date(); updateDateDisplay();
            fetch(`${APPS_SCRIPT_URL}?action=loadGlobal&classId=${CACHE_CONFIG.CLASS_ID}&token=homework2025`).then(r=>r.json()).then(res => {
                if(res.success && res.data){
                    const p = parseRawData(res.data);
                    if(p.events) globalEvents = p.events; if(p.config) globalConfig = p.config;
                    updateCountdown(new Date(currentDate.getFullYear(), currentDate.getMonth(), currentDate.getDate()).getTime());
                }
            });
            backgroundUpdateTimer = setInterval(() => { if (document.visibilityState === 'visible') performBackgroundUpdate(); }, CACHE_CONFIG.BACKGROUND_UPDATE_INTERVAL);
        });
    </script>
</body>
</html>
